services:
  fastapi:
    container_name: simple-webapp
    build: .
    networks:
      - webapp-network
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c import urllib.request"]
      interval: 30s
      timeout: 15s
      retries: 3
    depends_on:
      postgres-db:
        condition: service_healthy

  postgres-db:
    container_name: postgres
    image: postgres:14-alpine
    networks:
      - webapp-network
    volumes:
      - db-data:/var/lib/postgres/data
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=Password1.
      - POSTGRES_DB=web_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost -p 5432"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 10s

networks:
  webapp-network:

volumes:
  db-data: